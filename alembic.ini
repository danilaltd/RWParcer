[alembic]
script_location = app/infrastructure/db/alembic
prepend_sys_path = .
version_path_separator = os
# URL is resolved at runtime by app/infrastructure/db/alembic/env.py from
# DATABASE_URL / DATABASE_URL_SYNC (never hard-code a host here: migrations
# run inside the container against the "postgres_db" service).
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S