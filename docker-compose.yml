services:
  proxy-manager:
    image: ${PROXY_MANAGER_IMAGE:-rwparcer-proxy-manager}
    build:
      context: ./proxy-manager
      dockerfile: Dockerfile
    volumes:
      - ${PROXY_DB_PATH:-/var/lib/rwparcer/proxies.db}:/app/data/proxies.db
    environment:
      PROXY_MANAGER_PORT: ${PROXY_MANAGER_PORT:-8080}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-30}
      PROXY_DB_PATH: /app/data/proxies.db
    restart: ${RESTART_POLICY:-always}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  parcer:
    image: ${PARSER_IMAGE:-rwparcer}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${DATA_DIR:-/var/lib/rwparcer/data}:/app/data
    restart: ${PARSER_RESTART_POLICY:-unless-stopped}
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_BOT_ALLOWED_UPDATES: ${TG_BOT_ALLOWED_UPDATES:-}
      PROXY_MANAGER_URL: ${PROXY_MANAGER_URL:-http://proxy-manager:8080}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-rw_user}:${POSTGRES_PASSWORD:-test_password}@postgres_db:5432/${POSTGRES_DB:-core_db}"
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_db}
      POSTGRES_USER: ${POSTGRES_USER:-rw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 500M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rw_user} -d ${POSTGRES_DB:-core_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: