[project]
name = "rwparcer"
version = "0.1.0"
description = "RWParcer — rw.by train seat subscription Telegram bot (Python migration)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.7,<4",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
exclude = ["proxy-manager"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["B008", "ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.uv]
package = false

[tool.ty.src]
include = ["app", "tests"]
exclude = ["proxy-manager"]
