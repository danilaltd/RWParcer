info:
  name: get-train-number
  type: http
  seq: 15

http:
  method: GET
  url: https://apicast.{{process.env.DOMAIN}}/{{process.env.API_VER}}/rasp/ru/index/train_number/?format=json&train=051&user_key={{process.env.API_KEY}}
  params:
    - name: format
      value: json
      type: query
    - name: train
      value: "051"
      type: query
    - name: user_key
      value: "{{process.env.API_KEY}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
