info:
  name: get-passengers
  type: http
  seq: 1

http:
  method: GET
  url: https://apicast.{{process.env.DOMAIN}}/{{process.env.API_VER}}/passengers?user_key={{process.env.API_KEY}}
  params:
    - name: user_key
      value: "{{process.env.API_KEY}}"
      type: query
  auth:
    type: bearer
    token: "{{process.env.JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
