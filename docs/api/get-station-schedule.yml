info:
  name: get-station-schedule
  type: http
  seq: 17

http:
  method: GET
  url: https://apicast.{{process.env.DOMAIN}}/{{process.env.API_VER}}/rasp/ru/index/station?format=json&exp=2100195&date=everyday&user_key={{process.env.API_KEY}}
  params:
    - name: format
      value: json
      type: query
    - name: exp
      value: "2100195"
      type: query
    - name: date
      value: everyday
      type: query
    - name: user_key
      value: "{{process.env.API_KEY}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
