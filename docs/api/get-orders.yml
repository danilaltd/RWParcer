info:
  name: get-orders
  type: http
  seq: 1

http:
  method: GET
  url: https://apicast.{{process.env.DOMAIN}}/{{process.env.API_VER}}/numbered/orders?user_key={{process.env.API_KEY}}&orderType=PAST&departureDateMax=2026-10-02&departureDateMin=2023-07-02
  params:
    - name: user_key
      value: "{{process.env.API_KEY}}"
      type: query
    - name: orderType
      value: PAST
      type: query
    - name: orderType
      value: RETURNED
      type: query
      disabled: true
    - name: orderType
      value: UPCOMING
      type: query
      disabled: true
    - name: departureDateMax
      value: 2026-10-02
      type: query
    - name: departureDateMin
      value: 2023-07-02
      type: query
  body:
    type: json
    data: |-
      {
        "arrStationCode": "2100xxx",
        "depStationCode": "2100xxx",
        "departureDate": "yyyy-mm-dd",
        "departureTime": "hh:mm",
        "directionType": "TO",
        "registrationAllowed": true,
        "registrationNeeded": true,
        "train": "number",
        "trainLine": "L2",
        "trainTitle": "from — to",
        "tripCarriage": {
          "addSigns": "",
          "no": 3,
          "owner": "БЧ",
          "saleOnTwo": false,
          "serviceClassCode": "3Д",
          "serviceClassIntCode": "",
          "trainLetter": "Б",
          "typeCode": "П",
          "uz": false,
          "withASMBP": true,
          "withUKEB": false
        },
        "tripPassengers": [
          {
            "birthday": "yyyy-mm-dd",
            "country": "BLR",
            "coupe2MNumber": 0,
            "documentNumber": "number",
            "documentType": "УЛ",
            "firstName": "name",
            "id": 3335180,
            "lastName": "surname",
            "passengerType": "ADULT",
            "patronymic": "patronymic",
            "placesCount": 1,
            "sex": "M"
          }
        ],
        "tripSeatDetail": {
          "includedBedding": false,
          "numFrom": 50,
          "numTo": 50
        }
      }
  auth:
    type: bearer
    token: "{{process.env.JWT_TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
